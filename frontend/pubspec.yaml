name: smart_inventory
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Réseau & API
  http: ^1.2.0

  # Base de données & Stockage
  sqflite: ^2.3.0
  path: ^1.8.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2

  # Gestion d'état
  provider: ^6.1.1

  # Sécurité & Authentification
  local_auth: ^2.3.0
  crypto: ^3.0.3

  # Caméra, Images & ML (OCR)
  camera: ^0.10.5
  image_picker: ^1.0.7
  google_mlkit_text_recognition: ^0.13.0

  # Interface Utilisateur (UI) & Graphiques
  lucide_icons: ^0.257.0
  cupertino_icons: ^1.0.8
  fl_chart: ^0.66.0
  google_fonts: ^6.2.1

  # Rapports & Partage
  pdf: ^3.10.10
  printing: ^5.13.2
  excel: ^4.0.6
  share_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#0A0E1A"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logo.png
    - assets/authlogo.png
    - assets/data/medicines.json
    - assets/data/medicines_index.json
