name: smart_inventory
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  camera: ^0.10.5
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  local_auth: ^2.3.0 # For Fingerprint/FaceID
  image_picker: ^1.0.7

  lucide_icons: ^0.257.0
  cupertino_icons: ^1.0.8
  fl_chart: ^0.66.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  share_plus: ^10.1.0
  pdf: ^3.10.10
  printing: ^5.13.2
  excel: ^4.0.6
  path_provider: ^2.1.2
  image_picker: ^1.0.7


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#0A0E1A"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logo.png
    - assets/authlogo.png